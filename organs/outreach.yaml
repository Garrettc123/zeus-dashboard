id: outreach
family: Outreach
version: 0.1.0
display_name: Outreach
purpose: Snap-on organ that executes governed outreach sequences after RHNS confidence gate and proof link.

ports:
  requires:
    - core.identity
    - core.events
    - core.audit
    - rhns.cmc
  provides:
    - outreach.send

events:
  in:
    - name: lead.ready
      schema: LeadReady
  out:
    - name: outreach.sent
      schema: OutreachSent

policy:
  scope:
    - outreach.read
    - outreach.write
  forbidden:
    - billing.charge

rhns:
  planner: rgt+hrm
  gate: cmc
  commit_required_for:
    - outreach.send
  memory: federated-kg
  audit: ledger

detach:
  order:
    - deactivate subscriptions
    - freeze writes
    - export owned schema
    - drop routes
  retains:
    - audit ledger rows
  rollback: restore last certified schema version

pricing:
  sku: LLA-47
  pack: Outreach
  model: snap-module
  interval: one-time

skeleton_hops:
  - outreach

notes: |
  proof_hash: 2398aa32e69202313aeccadacb6638f32eb7e9df5697ad93f080a4fcc05a3060
  CMC commit required on send. MCP write.
